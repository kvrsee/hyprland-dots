background {
    monitor =
    path = /home/zann/.cache/current-wall
    blur_passes = 3
    blur_size = 8
}

shape {
    monitor =
    size = 1920, 1080
    color = rgba(30, 30, 46, 0.5)
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 180, 40
    rounding = 0
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(30, 30, 46, 0.9)
    font_color = rgba(205, 214, 244, 0.9)
    fade_on_empty = true
    placeholder_text = <span foreground="##89b4faaa">Password...</span>
    position = 0, -350
    halign = center
    valign = center
}

# Heures
label {
    monitor =
    text = cmd[update:1000] date +'%H'
    color = rgba(137, 202, 250, 1.0)
    font_size = 70
    font_family = JetBrainsMono Nerd Font
    position = 0, 330
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] date +'%M'
    color = rgba(137, 202, 250, 0.85)
    font_size = 70
    font_family = JetBrainsMono Nerd Font
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A %d %B'
    color = rgba(205, 214, 244, 0.6)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}
